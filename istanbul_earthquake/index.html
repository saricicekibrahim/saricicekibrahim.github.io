<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Thesis MAP</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>

<body>
<div id="map"></div>

<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: {
          type: "raster",
          tiles: [
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
          ],
          tileSize: 256
        },

        mytiles: {
          type: "vector",
          tiles: [
            "{z}/{x}/{y}.pbf"
          ],
          minzoom: 0,
          maxzoom: 14
        }
      },

      layers: [
        {
          id: "osm-base",
          type: "raster",
          source: "osm"
        },

        {
          id: "my-layer",
          type: "fill",
          source: "mytiles",
          "source-layer": "hex10",

          paint: {
            "fill-color": [
              "step",
              ["to-number", ["get", "sum_height_width"]],

              /* 0–28  */ "#ffff00",   // yellow
              28,        "#ffd54f",   // light orange
              91,        "#ffb74d",   // orange
              177,       "#ff8a65",   // dark orange
              291,       "#ff7043",   // light red-orange
              467,       "#f4511e",   // red
              912,       "#d32f2f",   // dark red
              1716,      "#b71c1c"    // very dark red (overflow)
            ],

            "fill-opacity": 0.6,

          }
        }
      ]
    },

    center: [28.949871, 41.013591],
    zoom: 13.611417151066254
  });
  map.on('moveend', () => {
  console.log('Zoom now is:', map.getZoom());
});
</script>
</body>
</html>
